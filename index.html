function calc(){const p=S.prof,bmr=10*p.w+6.25*p.h-5*p.age-161,tdee=bmr*[1.2,1.375,1.55,1.725][p.act];

const waterG=()=>S.prof?Math.max(6,Math.min(14,Math.round(S.prof.w*35/250))):8;
function menu(k){const base=Math.floor(pd(k)/864e5),c=calc(),p=S.prof;let cnt=0;

    const sc=Math.max(.5,Math.min(2,Math.round(c.kcal*sh/r[1]*4)/4));return{l,r,sc,kcal:Math.round(r[1]*sc),prot:Math.round(r[2]*sc)}})}
function cycInfo(){const c=S.cyc;if(!c.on||!c.starts.length)return null;const st=[...c.starts].sort(),last=st[st.length-1],L=c.len||28,day=dd(last,TODAY())+1;
  let next=last;while(dd(next,TODAY())>=0)next=addD(next,L);const late=day>L+3;const cd=((day-1)%L)+1;
  const ph=cd<=(c.dur||5)?"men":cd<=L-16?"fol":cd<=L-12?"ovu":"lut";return{day:cd,ph,next,inDays:dd(TODAY(),next),late}}

function readPhoto(file,kind){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function startBreath(i){timers.forEach(clearInterval);timers=[];const[nm,pat]=BREATH[i],ph=["Inhala","Sostén","Exhala","Sostén"],box=$("#bz"+i);let st=0,left=pat[0]||1,cycles=0;
  box.innerHTML=`<div class="circle" id="bc"><span id="bt"></span></div>`;const el=$("#bc"),tx=$("#bt");
  const show=()=>{while(!pat[st]){st=(st+1)%4}tx.textContent=ph[st]+" "+left;el.style.transform=st===0?"scale(1.3)":st===2?"scale(.8)":el.style.transform};
  left=pat[st];show();el.style.transitionDuration=pat[0]+"s";
  timers.push(setInterval(()=>{left--;if(left<=0){do{st=(st+1)%4}while(!pat[st]);if(st===0)cycles++;left=pat[st];el.style.transitionDuration=pat[st]+"s";if(cycles>=6){timers.forEach(clearInterval);tx.textContent="Muy bien ✓";return}}show()},1000))}
function startMed(i){timers.forEach(clearInterval);timers=[];const steps=MEDS[i][1],box=$("#mz"+i);let n=0,left=steps[0][1];const go=()=>{box.textContent=steps[n][0];speak(steps[n][0])};go();
  timers.push(setInterval(()=>{left--;if(left<=0){n++;if(n>=steps.length){timers.forEach(clearInterval);box.textContent="Listo ✓ Gracias por regalarte este momento.";return}left=steps[n][1];go()}},1000))}

function act(a,el){const [c,...r]=a.split(":");const k=TODAY();
  switch(c){
  case"tab":tab=r[0];op=null;render();scrollTo(0,0);break;
  case"sub":sub[r[0]]=r[1];op=null;render();break;
  case"go":tab=r[0];sub[r[0]]=r[1];op=null;render();scrollTo(0,0);break;
  case"open":op=op===r[0]?null:r[0];render();break;
  case"done":S.wk[k]=S.wk[k]===r[0]?null:r[0];save();render();break;
  case"water":S.water[k]=Math.max(0,(S.water[k]||0)+ +r[0]);save();render();break;
  case"hab":{const h=S.hab[k]=S.hab[k]||{};h[r[0]]=!h[r[0]];save();render();break}
  case"mood":{const d=r[1];S.mood[d]=Object.assign(S.mood[d]||{},{m:+r[0]});save();render();break}
  case"ch":{const a=S.ch[r[0]]=S.ch[r[0]]||[];a[+r[1]]=!a[+r[1]];save();render();break}
  case"shop":S.shop[r.join(":")]=!S.shop[r.join(":")];save();render();break;
  case"shopreset":S.shop={};save();render();break;
  case"skin":{const d=r[1],o=S.skin[d]=S.skin[d]||{};o[r[0]]=!o[r[0]];save();render();break}
  case"care":{const o=S.care[r[0]]=S.care[r[0]]||{};o[r[1]]=!o[r[1]];save();render();break}
  case"breath":startBreath(+r[0]);break;
  case"med":startMed(+r[0]);break;
  case"medstop":timers.forEach(clearInterval);try{speechSynthesis.cancel()}catch(e){}break;
  case"sday":{const n=(sday||k);const t=addD(n,+r[0]);if(dd(t,k)>=0)sday=t;render();break}
  case"cycopt":S.cyc.on=!S.cyc.on;save();el.classList.toggle("on",S.cyc.on);el.querySelector(".ck").innerHTML=S.cyc.on?ic("check"):"";break;
  case"cycon":S.cyc.on=true;save();render();break;
  case"period":if(!S.cyc.starts.includes(k))S.cyc.starts.push(k);save();render();break;
  case"sym":{const s=S.cyc.sym[k]=S.cyc.sym[k]||[],x=r.join(":"),i=s.indexOf(x);i>=0?s.splice(i,1):s.push(x);save();render();break}
  case"addh":{const v=$("#newh").value.trim();if(v){S.custom.push(v);save();render()}break}
  case"delh":S.custom.splice(+r[0],1);save();render();break;
  case"delph":PH[r[0]]=PH[r[0]].filter(x=>x.id!==r[1]);savePh();render();break;
  case"play":startPlayer(r[0]);break;
  case"rng":obRange=+r[0];obAge=[24,35,45,58][+r[0]];render();scrollTo(0,0);break;
  case"rngback":obRange=null;render();break;
  case"sdw":sdW=r[0];render();break;
  case"guideoff":S.guideOff=true;save();render();break;
  case"logout":S.acc=null;save();render();break;
  }}

let PL=null,plT=null;
const MET={inf:5,sup:4.5,core:4,full:5.5,cardio:7,hiit:8.5,relax:2.5,mov:2.5};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function parseDose(s){const m=String(s).match(/(\d+(?:[.,]\d+)?)\s*(min|s)\b/i);if(m){const v=parseFloat(m[1].replace(",","."));return{sec:Math.round(/min/i.test(m[2])?v*60:v)}}const r=String(s).match(/\d+/);return{reps:r?+r[0]:10}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},200)}catch(e){}try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
function startPlayer(id){const r=LIB.find(x=>x.id===id);if(!r)return;const easy=r.tipo==="relax"||r.tipo==="mov",rounds=easy?1:[2,3,4][S.prof.level],st=[];
  for(let k=0;k<rounds;k++)r.ex.forEach(e=>st.push(Object.assign({n:e[0],dose:e[1],round:k+1,rounds,kind:kindOf(e[0],r.tipo)},parseDose(e[1]))));
  PL={r,st,i:0,ph:"ready",end:0,left:0,t0:Date.now(),rest:easy?0:20,logged:false};
  let el=document.getElementById("pl");if(!el){el=document.createElement("div");el.id="pl";document.body.appendChild(el)}document.body.style.overflow="hidden";clearInterval(plT);plT=setInterval(plTick,200);plShow()}
function plLog(markDone){if(!PL||PL.logged)return;const min=Math.round((Date.now()-PL.t0)/60000);if(min<1&&!markDone)return;const m=Math.max(1,min),kg=(S.prof&&S.prof.w)||65,kcal=Math.round((MET[PL.r.tipo]||5)*3.5*kg/200*m),k=TODAY(),o=S.wlog[k]||{min:0,kcal:0,n:0};
  S.wlog[k]={min:o.min+m,kcal:o.kcal+kcal,n:o.n+1};if(markDone)S.wk[k]=PL.r.id;PL.logged=true;PL.sum={m,kcal};save()}
function plGo(n,auto){PL.i=n;const s=PL.st[n];if(s.sec&&auto){PL.ph="run";PL.end=Date.now()+s.sec*1000}else PL.ph="ready";plShow()}
function plFinish(){beep();if(PL.i>=PL.st.length-1){plLog(true);PL.ph="done";plShow()}else if(PL.rest>0){PL.ph="rest";PL.end=Date.now()+PL.rest*1000;plShow()}else plGo(PL.i+1,true)}
function plTick(){if(!PL||(PL.ph!=="run"&&PL.ph!=="rest"))return;const left=PL.end-Date.now(),big=document.getElementById("plbig");if(big)big.textContent=mmss(left);
  if(left<=0){if(PL.ph==="run")plFinish();else plGo(PL.i+1,true)}}
function plAct(a){if(!PL)return;const s=PL.st[PL.i];
  if(a==="exit"){plLog(false);plClose();return}
  if(a==="close"){plClose();return}
  if(a==="main"){if(PL.ph==="ready"){if(s.sec){PL.ph="run";PL.end=Date.now()+s.sec*1000;plShow()}else plFinish()}else if(PL.ph==="run"){PL.left=PL.end-Date.now();PL.ph="pause";plShow()}else if(PL.ph==="pause"){PL.ph="run";PL.end=Date.now()+PL.left;plShow()}}
  if(a==="prev"&&PL.i>0)plGo(PL.i-1,false);
  if(a==="next"){if(PL.i<PL.st.length-1)plGo(PL.i+1,false);else{plLog(true);PL.ph="done";plShow()}}
  if(a==="skip")plGo(PL.i+1,true);
  if(a==="add"&&PL.ph==="rest")PL.end+=10000}
function plClose(){clearInterval(plT);const el=document.getElementById("pl");if(el)el.remove();document.body.style.overflow="";PL=null;render()}
function plShow(){const el=document.getElementById("pl");if(!el||!PL)return;const s=PL.st[PL.i],tot=PL.st.length;let h="";
  if(PL.ph==="done"){const sm=PL.sum||{m:1,kcal:0};
    h=`<div class="plh"><span></span><span></span><span></span></div><div style="margin:auto 0"><div class="plfig" style="background:#fff">${ring(1,"#D8A0A8","✓",190)}</div><h2>¡Lo lograste!</h2><p class="sub" style="margin:6px 0 16px">${esc(PL.r.n)}</p>
    <div class="g3" style="margin-bottom:18px"><div class="m"><div class="big">${sm.m}</div><small>minutos</small></div><div class="m"><div class="big">${sm.kcal}</div><small>kcal aprox.</small></div><div class="m"><div class="big">${tot}</div><small>ejercicios</small></div></div><button class="btn" data-p="close">LISTO</button></div>`}
  else if(PL.ph==="rest"){const nx=PL.st[PL.i+1];
    h=`<div class="plh"><button data-p="exit">✕</button><span>Descanso</span><span style="width:38px"></span></div><div class="plbar"><i style="width:${(PL.i+1)/tot*100}%"></i></div><div style="margin:auto 0"><h2>Descansa</h2><div class="plbig" id="plbig">${mmss(PL.end-Date.now())}</div><p class="sub">A continuación</p><div class="plfig" style="width:min(48vw,200px)">${fig(nx.kind,0,true)}</div><h2 style="font-size:1.5rem">${esc(nx.n)}</h2><p class="sub">${esc(nx.dose)}</p></div>
    <div class="plbtns"><button class="rnd" data-p="add" aria-label="+10 s" style="font-size:.85rem">+10s</button><button class="btn" data-p="skip">SALTAR</button></div>`}
  else{const timed=!!s.sec,run=PL.ph==="run",pause=PL.ph==="pause";
    h=`<div class="plh"><button data-p="exit">✕</button><span>Ejercicio ${PL.i+1}/${tot}${s.rounds>1?" · vuelta "+s.round+"/"+s.rounds:""}</span><span style="width:38px"></span></div><div class="plbar"><i style="width:${PL.i/tot*100}%"></i></div>
    <div style="margin:auto 0;width:100%"><div class="plfig">${fig(s.kind,0,run||PL.ph==="ready")}</div><h2>${esc(s.n)}</h2><div class="plbig" id="plbig">${timed?mmss(run?PL.end-Date.now():pause?PL.left:s.sec*1000):s.reps}</div><p class="sub">${timed?"tiempo":"repeticiones"+(/por (\w+)/.test(s.dose)?" por "+RegExp.$1:"")}</p></div>
    <div class="plbtns"><button class="rnd" data-p="prev" aria-label="Anterior">${ic("left")}</button><button class="btn" data-p="main">${timed?(run?"PAUSAR":pause?"CONTINUAR":"INICIAR"):"✓ LISTO"}</button><button class="rnd" data-p="next" aria-label="Siguiente">${ic("right")}</button></div>`}
  el.innerHTML=h;startAnims()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b)plAct(b.dataset.p)});

/* ---- selección de rutinas según edad, lugar y tiempo ---- */
function pick(type,j){const p=S.prof,lv=p.level+1,m=MONTH(),wn=WEEKN(),rg=p.range||0,tm=p.time||30,pl=p.place;
  if(type==="hiit"&&rg>=2)type="cardio";
  const okp=r=>pl==="ambos"?r.lug!=="o":pl==="oficina"?r.lug==="o":pl==="gym"?r.lug==="g":r.lug==="c";
  const base=r=>r.mes<=m&&r.niv<=lv&&okp(r)&&!(rg>=2&&r.tipo==="hiit");
  let c=LIB.filter(r=>r.tipo===type&&base(r));if(!c.length)c=LIB.filter(base);if(!c.length)c=LIB.filter(r=>r.mes<=m&&okp(r));if(!c.length)c=LIB;
  let t=c.filter(r=>r.min<=tm+5);if(!t.length)t=LIB.filter(base).filter(r=>r.min<=tm+5);if(t.length)c=t;
  if(rg>=3){const soft=c.filter(r=>/h17|h18|h6|h7|h10|h11|h4|h13|o\d|g3|g4/.test(r.id));if(soft.length)c=soft}
  return c[(wn+j)%c.length]}
